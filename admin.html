<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss CMS - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Arial Black"', '"Segoe UI"', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace']
                    },
                    colors: {
                        bgA: '#eef1dd',
                        textDark: '#1e2230',
                        muted: '#4a5268',
                        accentPrimary: '#e87f5a',
                        line: '#2f3442'
                    },
                    boxShadow: {
                        'swiss': '6px 6px 0 #2f3442',
                        'swiss-sm': '3px 3px 0 #2f3442'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgA text-textDark antialiased min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-white border-b-[3px] border-black px-6 py-4 flex flex-col md:flex-row justify-between items-center shadow-swiss-sm sticky top-0 z-50 mb-8">
        <a href="index.html" class="font-black text-2xl hover:text-accentPrimary transition-colors mb-4 md:mb-0">Back to Site</a>
        <div class="flex gap-4">
            <a href="index.html#blog" class="font-black border-[3px] border-black px-4 py-2 hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform shadow-swiss-sm bg-[#eef1dd] text-black">Blog Posts</a>
        </div>
    </nav>

    <div class="max-w-[1020px] mx-auto p-6 md:p-8">

        <!-- Auth Section -->
        <div id="auth-section" class="bg-white border-[3px] border-black p-8 md:p-12 shadow-swiss max-w-md mx-auto mt-8">
            <h2 class="text-3xl font-black mb-2">Admin Login</h2>
            <p class="text-muted font-bold mb-8">Authenticate with GitHub to edit content.</p>
            
            <div class="space-y-6">
                <div>
                    <label class="block font-black mb-2">Repository Name</label>
                    <input id="repo" type="text" value="bsabio/midterm_IS322" class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none focus:border-accentPrimary">
                </div>
                <div>
                    <label class="block font-black mb-2">GitHub Token (PAT)</label>
                    <input id="token" type="password" placeholder="ghp_..." class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none focus:border-accentPrimary">
                </div>
                <div>
                    <label class="block font-black mb-2">OpenAI Key (Voice-to-Blog)</label>
                    <input id="openai-key" type="password" placeholder="sk-proj-..." class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none focus:border-accentPrimary">
                    <p class="text-sm text-muted font-bold mt-2">Saved locally in your browser.</p>
                </div>
                <button id="login-btn" onclick="authenticate()" class="w-full bg-accentPrimary border-[3px] border-black text-black font-black px-4 py-3 shadow-swiss hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">
                    Connect to GitHub
                </button>
                <div id="auth-error" class="hidden text-red-600 font-bold text-center mt-4"></div>
            </div>
        </div>

        <!-- Main Admin Section -->
        <div id="admin-section" class="hidden">
            
            <!-- Tabs -->
            <div class="flex gap-4 mb-8">
                <button onclick="switchTab('site')" id="tab-site" class="bg-accentPrimary border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">Site Details</button>
                <button onclick="switchTab('blog')" id="tab-blog" class="bg-white border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">Blog Posts</button>
            </div>

            <!-- ======================= -->
            <!-- SITE DETAILS EDITOR     -->
            <!-- ======================= -->
            <div id="view-site" class="bg-white border-[3px] border-black p-8 md:p-10 shadow-swiss">
                <div class="flex flex-col md:flex-row justify-between md:items-center mb-8 border-b-[3px] border-black pb-6 gap-4">
                    <h2 class="text-3xl font-black">Edit Site Content</h2>
                    <button id="save-site-btn" onclick="saveSiteChanges()" class="bg-accentPrimary border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">
                        Save Changes
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <h3 class="text-xl font-black border-b-[3px] border-black pb-2">Basic Info</h3>
                        <div>
                            <label class="block font-black mb-2">Consultant Name</label>
                            <input id="input-name" type="text" class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-black mb-2">Contact Email</label>
                            <input id="input-email" type="email" class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-black mb-2">Tagline</label>
                            <input id="input-tagline" type="text" class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-black mb-2">Bio</label>
                            <textarea id="input-bio" rows="6" class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none"></textarea>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center border-b-[3px] border-black pb-2 mb-6">
                            <h3 class="text-xl font-black">Services</h3>
                            <button onclick="addService()" class="text-black font-black underline hover:text-accentPrimary">+ Add Service</button>
                        </div>
                        <div id="services-container" class="space-y-6"></div>
                    </div>
                </div>
            </div>

            <!-- ======================= -->
            <!-- BLOG POSTS MANAGER      -->
            <!-- ======================= -->
            <div id="view-blog" class="hidden bg-white border-[3px] border-black p-8 md:p-10 shadow-swiss">
                <div class="flex justify-between items-center mb-8 border-b-[3px] border-black pb-6">
                    <h2 class="text-3xl font-black">Blog Posts</h2>
                    <button onclick="openPostEditor()" class="bg-accentPrimary border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">New Post</button>
                </div>
                <div id="blog-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="text-muted font-bold">Loading posts...</div>
                </div>
            </div>

            <!-- ======================= -->
            <!-- BLOG POST EDITOR        -->
            <!-- ======================= -->
            <div id="view-post-editor" class="hidden bg-white border-[3px] border-black p-8 md:p-10 shadow-swiss">
                <div class="flex flex-col md:flex-row justify-between md:items-center mb-8 border-b-[3px] border-black pb-6 gap-4">
                    <h2 class="text-3xl font-black" id="post-editor-title">Edit Post</h2>
                    <div class="flex gap-4">
                        <button onclick="switchTab('blog')" class="bg-white border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">Cancel</button>
                        <button id="save-post-btn" onclick="savePost()" class="bg-accentPrimary border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">Save Post</button>
                    </div>
                </div>
                
                <!-- Whisper Voice Dictation Panel -->
                <div class="mb-8 p-6 bg-[#dce8f3] border-[3px] border-black">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-2">
                        <h3 class="text-lg font-black">Voice-to-Blog (OpenAI Whisper)</h3>
                        <span id="record-status" class="text-muted font-bold">Ready</span>
                    </div>
                    <div class="flex gap-4 items-center">
                        <button id="btn-start-record" onclick="startRecording()" class="bg-[#fcd34d] border-[3px] border-black text-black font-black px-4 py-2 shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">Start Recording</button>
                        <button id="btn-stop-record" onclick="stopRecording()" disabled class="bg-gray-300 border-[3px] border-black text-gray-500 font-black px-4 py-2 opacity-50 cursor-not-allowed">Stop & Transcribe</button>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block font-black mb-2">Filename (must end in .md)</label>
                    <input id="input-post-filename" type="text" placeholder="my-new-post.md" class="w-full bg-white border-[3px] border-black px-4 py-3 font-bold focus:outline-none focus:border-accentPrimary">
                </div>
                <div class="mb-6">
                    <label class="block font-black mb-2">Markdown Content (Start with # Title)</label>
                    <textarea id="input-post-content" rows="15" class="w-full bg-white border-[3px] border-black px-4 py-3 font-medium focus:outline-none focus:border-accentPrimary font-mono leading-relaxed"></textarea>
                </div>
                <input type="hidden" id="input-post-sha">
            </div>

        </div>
    </div>

    <script>
        let siteDataSha = '';
        let siteData = {};
        let currentToken = '';
        let currentRepo = '';
        let mediaRecorder;
        let audioChunks = [];

        window.onload = () => {
            const savedKey = localStorage.getItem('openai_key');
            if (savedKey) document.getElementById('openai-key').value = savedKey;
            const savedGhToken = localStorage.getItem('gh_token');
            if (savedGhToken) document.getElementById('token').value = savedGhToken;
        };

        function b64DecodeUnicode(str) {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }
        function b64EncodeUnicode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
                function toSolidBytes(match, p1) { return String.fromCharCode('0x' + p1); }));
        }
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function githubAPI(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Authorization': `token ${currentToken}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                }
            };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(`https://api.github.com/repos/${currentRepo}/${endpoint}`, options);
            if (!response.ok) throw new Error(await response.text());
            return response.json();
        }

        async function authenticate() {
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('auth-error');
            currentToken = document.getElementById('token').value.trim();
            currentRepo = document.getElementById('repo').value.trim();
            const openAIKey = document.getElementById('openai-key').value.trim();
            
            if(!currentToken || !currentRepo) {
                errorDiv.innerText = "Please fill out GitHub Token and Repo.";
                errorDiv.classList.remove('hidden'); return;
            }

            localStorage.setItem('gh_token', currentToken);
            if (openAIKey) localStorage.setItem('openai_key', openAIKey);

            btn.innerText = "Connecting...";
            errorDiv.classList.add('hidden');
            
            try {
                const data = await githubAPI('contents/content/data.json');
                siteDataSha = data.sha;
                siteData = JSON.parse(b64DecodeUnicode(data.content));
                
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                
                renderSiteForm();
                await fetchBlogPosts();
            } catch (err) {
                errorDiv.innerText = "Auth failed. Check token/repo.";
                errorDiv.classList.remove('hidden');
                btn.innerText = "Connect to GitHub";
            }
        }

        function switchTab(tab) {
            document.getElementById('view-site').classList.add('hidden');
            document.getElementById('view-blog').classList.add('hidden');
            document.getElementById('view-post-editor').classList.add('hidden');
            
            document.getElementById('tab-site').className = "bg-white border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform";
            document.getElementById('tab-blog').className = "bg-white border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform";

            if (tab === 'site') {
                document.getElementById('view-site').classList.remove('hidden');
                document.getElementById('tab-site').className = "bg-accentPrimary border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform";
            } else if (tab === 'blog') {
                document.getElementById('view-blog').classList.remove('hidden');
                document.getElementById('tab-blog').className = "bg-accentPrimary border-[3px] border-black text-black font-black px-6 py-2 shadow-swiss hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform";
                fetchBlogPosts();
            }
        }

        // ============================
        // VOICE-TO-BLOG (WHISPER)
        // ============================
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    stream.getTracks().forEach(track => track.stop());
                    await processAudio(blob);
                };
                mediaRecorder.start();
                
                const btnStart = document.getElementById('btn-start-record');
                const btnStop = document.getElementById('btn-stop-record');
                
                btnStart.disabled = true;
                btnStart.className = "bg-gray-300 border-[3px] border-black text-gray-500 font-black px-4 py-2 opacity-50 cursor-not-allowed";
                btnStop.disabled = false;
                btnStop.className = "bg-red-600 border-[3px] border-black text-white font-black px-4 py-2 shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform";
                document.getElementById('record-status').innerHTML = '<span class="text-red-600 animate-pulse font-black">● Recording...</span>';
            } catch (err) { alert("Microphone error: " + err.message); }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                const btnStart = document.getElementById('btn-start-record');
                const btnStop = document.getElementById('btn-stop-record');
                btnStop.disabled = true;
                btnStop.className = "bg-gray-300 border-[3px] border-black text-gray-500 font-black px-4 py-2 opacity-50 cursor-not-allowed";
                btnStart.disabled = false;
                btnStart.className = "bg-[#fcd34d] border-[3px] border-black text-black font-black px-4 py-2 shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform";
                document.getElementById('record-status').innerText = "Processing audio...";
            }
        }

        async function processAudio(blob) {
            const apiKey = localStorage.getItem('openai_key');
            if (!apiKey) {
                alert("OpenAI API Key missing.");
                document.getElementById('record-status').innerText = "Failed: Missing API Key";
                return;
            }
            try {
                document.getElementById('record-status').innerText = "Transcribing with Whisper...";
                const formData = new FormData();
                formData.append('file', new File([blob], 'audio.webm', { type: blob.type }));
                formData.append('model', 'whisper-1');

                const transcribeRes = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}` },
                    body: formData
                });
                if (!transcribeRes.ok) throw new Error(await transcribeRes.text());
                const transcript = (await transcribeRes.json()).text;

                document.getElementById('record-status').innerText = "Formatting to Markdown...";
                const prompt = `You are a blog writer. Convert this transcript into Markdown. Start with an # H1. No intro/outro/backticks.\n\nTranscript: ${transcript}`;
                const chatRes = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'gpt-4o-mini', messages: [{ role: 'user', content: prompt }] })
                });

                if (!chatRes.ok) throw new Error(await chatRes.text());
                let markdown = (await chatRes.json()).choices[0].message.content;
                markdown = markdown.replace(/^```markdown\n/g, '').replace(/```$/g, '');

                const currentContent = document.getElementById('input-post-content').value;
                document.getElementById('input-post-content').value = (currentContent ? currentContent + '\n\n' : '') + markdown;
                if (!document.getElementById('input-post-filename').value) {
                    document.getElementById('input-post-filename').value = `${new Date().toISOString().split('T')[0]}-voice-post.md`;
                }
                document.getElementById('record-status').innerText = "Ready to save!";
            } catch (err) {
                alert("Error: " + err.message);
                document.getElementById('record-status').innerText = "Error occurred.";
            }
        }

        // ============================
        // SITE EDITOR LOGIC
        // ============================
        function renderSiteForm() {
            document.getElementById('input-name').value = siteData.consultant_name || '';
            document.getElementById('input-email').value = siteData.contact_email || '';
            document.getElementById('input-tagline').value = siteData.tagline || '';
            document.getElementById('input-bio').value = siteData.bio || '';
            const container = document.getElementById('services-container');
            container.innerHTML = '';
            if(siteData.services) {
                siteData.services.forEach((srv, index) => {
                    injectServiceHTML(srv.id || `service-${Date.now()}-${index}`, srv.name, srv.description);
                });
            }
        }

        function injectServiceHTML(id, name, desc) {
            const container = document.getElementById('services-container');
            const div = document.createElement('div');
            div.className = "bg-[#f6f7fb] p-6 border-[3px] border-black relative service-item mb-4 shadow-swiss-sm";
            div.innerHTML = `
                <input type="hidden" class="srv-id" value="${id}">
                <button onclick="this.parentElement.remove()" class="absolute top-4 right-4 text-black hover:text-red-600 font-black px-2 py-1 border-[2px] border-black bg-white shadow-swiss-sm hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform">X</button>
                <div class="mb-4">
                    <label class="block font-black mb-2">Service Name</label>
                    <input type="text" class="srv-name w-full bg-white border-[3px] border-black px-4 py-2 font-bold focus:outline-none" value="${escapeHTML(name)}">
                </div>
                <div>
                    <label class="block font-black mb-2">Description</label>
                    <textarea rows="3" class="srv-desc w-full bg-white border-[3px] border-black px-4 py-2 font-bold focus:outline-none">${escapeHTML(desc)}</textarea>
                </div>
            `;
            container.appendChild(div);
        }

        function addService() { injectServiceHTML(`service-${Date.now()}`, '', ''); }

        async function saveSiteChanges() {
            const btn = document.getElementById('save-site-btn');
            btn.innerText = `Saving...`; btn.disabled = true;

            siteData.consultant_name = document.getElementById('input-name').value;
            siteData.contact_email = document.getElementById('input-email').value;
            siteData.tagline = document.getElementById('input-tagline').value;
            siteData.bio = document.getElementById('input-bio').value;

            const newServices = [];
            document.querySelectorAll('.service-item').forEach(item => {
                newServices.push({
                    id: item.querySelector('.srv-id').value,
                    name: item.querySelector('.srv-name').value,
                    description: item.querySelector('.srv-desc').value
                });
            });
            siteData.services = newServices;

            const body = {
                message: "docs(site): update content via Swiss admin dashboard",
                content: b64EncodeUnicode(JSON.stringify(siteData, null, 2)),
                sha: siteDataSha,
                branch: "main"
            };
            
            try {
                const res = await githubAPI('contents/content/data.json', 'PUT', body);
                siteDataSha = res.content.sha;
                alert('Site saved successfully! GitHub Actions is rebuilding your site.');
            } catch (err) { alert("Error: " + err.message); } 
            finally { btn.innerText = `Save Changes`; btn.disabled = false; }
        }

        // ============================
        // BLOG MANAGER LOGIC
        // ============================
        async function fetchBlogPosts() {
            const listDiv = document.getElementById('blog-list');
            listDiv.innerHTML = '<div class="text-muted font-bold">Loading posts...</div>';
            try {
                const data = await githubAPI('contents/content/posts');
                listDiv.innerHTML = '';
                if (data.length === 0) listDiv.innerHTML = '<div class="text-muted font-bold">No posts found.</div>';
                
                data.filter(f => f.name.endsWith('.md')).forEach(file => {
                    const el = document.createElement('div');
                    el.className = "bg-white p-6 border-[3px] border-black shadow-swiss-sm flex justify-between items-center hover:-translate-y-[1px] hover:-translate-x-[1px] transition-transform cursor-pointer";
                    el.onclick = () => loadPost(file.name, file.sha);
                    el.innerHTML = `
                        <div>
                            <div class="font-black mb-1">${escapeHTML(file.name)}</div>
                            <div class="text-muted text-sm font-bold">Markdown File</div>
                        </div>
                        <div class="bg-accentPrimary border-[2px] border-black px-3 py-1 font-black text-sm shadow-swiss-sm">Edit &rarr;</div>
                    `;
                    listDiv.appendChild(el);
                });
            } catch (err) {
                if(err.message.includes('404')) {
                    listDiv.innerHTML = '<div class="text-muted font-bold">No posts folder found. Click New Post to start!</div>';
                } else {
                    listDiv.innerHTML = `<div class="text-red-600 font-bold">Error loading posts: ${escapeHTML(err.message)}</div>`;
                }
            }
        }

        function openPostEditor(filename = '', content = '', sha = '') {
            document.getElementById('view-blog').classList.add('hidden');
            document.getElementById('view-post-editor').classList.remove('hidden');
            
            document.getElementById('post-editor-title').innerText = filename ? "Edit Post" : "Create New Post";
            document.getElementById('input-post-filename').value = filename;
            document.getElementById('input-post-filename').disabled = !!filename; 
            document.getElementById('input-post-content').value = content;
            document.getElementById('input-post-sha').value = sha;
            document.getElementById('record-status').innerText = "Ready";
        }

        async function loadPost(filename, sha) {
            try {
                const data = await githubAPI(`contents/content/posts/${filename}`);
                const content = b64DecodeUnicode(data.content);
                openPostEditor(filename, content, sha);
            } catch (err) { alert('Error loading post: ' + err.message); }
        }

        async function savePost() {
            const btn = document.getElementById('save-post-btn');
            const filename = document.getElementById('input-post-filename').value.trim();
            const content = document.getElementById('input-post-content').value;
            const sha = document.getElementById('input-post-sha').value;

            if (!filename.endsWith('.md')) { alert("Filename must end in .md"); return; }
            if (!content) { alert("Content cannot be empty."); return; }

            btn.innerText = `Saving...`; btn.disabled = true;

            const body = {
                message: `docs(blog): ${sha ? 'update' : 'create'} post ${filename}`,
                content: b64EncodeUnicode(content),
                branch: "main"
            };
            if (sha) body.sha = sha;

            try {
                const res = await githubAPI(`contents/content/posts/${filename}`, 'PUT', body);
                document.getElementById('input-post-sha').value = res.content.sha;
                alert('Post saved! GitHub Actions is rebuilding your site.');
                switchTab('blog'); 
            } catch (err) { alert("Error: " + err.message); } 
            finally { btn.innerText = `Save Post`; btn.disabled = false; }
        }
    </script>
